syntax = "proto3";
option go_package = "handin3/grpc/proto";


message ChatMessage {
    int32 clock = 1;
    string msg = 2;  
}

message UserDetails {
    int32 clock = 1;
    string username = 2;
}

message Empty {}

service chitchat {
    rpc post (ChatMessage) returns (Empty);
    rpc broadcast (UserDetails) returns (stream ChatMessage);
}