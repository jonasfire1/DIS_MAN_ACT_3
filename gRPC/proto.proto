syntax = "proto3";
option go_package = "handin3/grpc/proto";


message ChatMessage {
    int32 clock = 1;
    string username = 2;
    string msg = 3;
}

message UserDetails {
    int32 clock = 1;
    string username = 2;
}

message acknowledgement {}

service chitchat {
    rpc post (ChatMessage) returns (acknowledgement);
    rpc joinBroadcast (UserDetails) returns (stream ChatMessage);
    rpc leaveBroadcast (UserDetails) returns (acknowledgement);
}